name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

env:
  CARGO_TERM_COLOR: always
  rust_min: '1.85'

jobs:
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run audit
        uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver_checks:
    # Pre-merge guard against accidental public-API breakage on the path
    # to 1.0. Runs only on PRs (where the base commit is well-defined);
    # `push`/`schedule` skip this job. Non-blocking: a true breaking
    # change can still be merged when intentional, but it must be
    # acknowledged in the PR — the failed check makes the diff visible
    # in the review surface. See workstream A-1 of the comprehensive
    # review.
    name: SemVer Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check semver (rsbinder + rsbinder-aidl)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # The two published library crates whose public API stability
          # matters to downstream consumers. `rsbinder-tools` is binaries
          # only, no library surface.
          package: rsbinder,rsbinder-aidl
          # `default` profile already exercises the common surface; the
          # RPC stack has its own dedicated stability discussion (see
          # RpcServer::set_max_threads rustdoc) and is checked under
          # `rpc` features by the next step.
          feature-group: default-features
      - name: Check semver (rsbinder w/ rpc features)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rsbinder
          feature-group: only-explicit-features
          # `async` is added so the published-baseline build can resolve
          # `crate::BoxFuture` re-exported from `lib.rs` under
          # `#[cfg(feature = "async")]`. The latest published rsbinder
          # (currently 0.8.0) emits async-trait references unconditionally
          # in its generated code — fixed on HEAD via `build.rs` reading
          # `CARGO_FEATURE_ASYNC`, but the baseline can't be retroactively
          # patched. Without `async` in the feature set, semver-checks
          # fails to `cargo doc` the baseline crate.
          features: rpc,rpc-tcp-debug,rpc-tls,rpc-vsock,async

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check rustdoc
        # docs.rs builds `rsbinder` with `all-features`, so a link that only
        # resolves with `rpc` on still ships — but anyone running `cargo doc`
        # on a default-feature dependency sees it break. Gate both.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps --all-features
          cargo doc --workspace --no-deps

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: "" # remove -Dwarnings
      - name: Build release
        run: cargo build --workspace --release
      - name: Check test builds
        # The only workspace-wide enumeration this workflow has — but it
        # compiles, it does not run, and a target gated on a feature the run
        # does not enable compiles to *zero* tests. So every test target is
        # either named on a `--test` line in `rpc-suite` / `macos-build`, or
        # run whole-package (`-p rsbinder-aidl`, `-p rsbinder-macros`, whose
        # targets are ungated), or excluded here on purpose:
        #   * rsbinder/tests/rpc_vsock.rs — every test in it is `#[ignore]`d
        #     (needs a peer VM or the `vsock_loopback` module), so running it
        #     yields nothing; the `test` job's
        #     `cargo clippy --all-targets --all-features` is what type-checks
        #     it (the `rpc-vsock` matrix step is a plain `cargo build`, which
        #     compiles lib + bins only, never `tests/`).
        #   * rsbinder/tests/loom_cache_pin.rs — `cfg(loom)`, empty without
        #     `RUSTFLAGS="--cfg loom"`; a loom run is a manual exercise.
        #   * tests/tests/mesh_rpc.rs, tests/tests/mesh_kernel.rs — the
        #     multi-process mesh: minutes-expensive, and `mesh_kernel` needs
        #     /dev/binder plus a live rsb_hub, so integration-test.yml owns
        #     both.
        #   * tests/tests/gateway_kernel.rs — every test in it is `#[ignore]`d
        #     and needs /dev/binder plus a live rsb_hub to drive an RPC client
        #     through a gateway to a kernel service, so integration-test.yml
        #     owns it.
        # Adding a test target means adding it to one of those lines, or to
        # this list with the reason it cannot run here.
        run: |
          cargo test --workspace --no-run
      - name: AIDL compiler tests (hermetic — plan 3 AC-3.4)
        # The `rsbinder-aidl` integration tests — including
        # `aidl_fixture_sweep` which walks all AOSP `.aidl` fixtures
        # and gates on `syn::parse_file` of every emitted file plus the
        # expected-fail allowlist (plan 3 §3 AC-3.1/3.3) — are hermetic
        # (no /dev/binder, no kernel binder, no servicemanager) and
        # must run on every PR so codegen regressions are caught
        # before merge.
        run: cargo test -p rsbinder-aidl

  rpc-suite:
    name: RPC Transport Suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The RPC stack is hermetic — mem/unix backends only, no
      # /dev/binder, no binderfs, no servicemanager (master §6). It
      # runs on a plain runner, unlike the kernel-binder matrix in
      # integration-test.yml. This job is the missing CI enforcement
      # of the plan's V1/V4/V5 gates for the RPC stack (T3).
      - name: AC-1.1 build matrix (rpc OFF / rpc / tcp-debug / tls / vsock)
        run: |
          cargo build -p rsbinder
          cargo build -p rsbinder --features rpc
          cargo build -p rsbinder --features rpc-tcp-debug
          cargo build -p rsbinder --features rpc-tls
          cargo build -p rsbinder --features rpc-vsock
      - name: RPC unit + e2e (rsbinder, hermetic — multi-conn now default per AC-12.6)
        # `rpc_transport_conformance` is what makes the
        # `RpcTransport::shutdown` contract measured rather than merely
        # written, and the behaviour it pins differs by platform — so it
        # runs here *and* in `macos-build`. The file is
        # `#![cfg(feature = "rpc")]` with `#[cfg(feature =
        # "rpc-tcp-debug")]` / `#[cfg(feature = "rpc-tls")]` submodules:
        # the plain `rpc` run covers the unix/unix-fd/mem cases, and the
        # TLS run adds `rpc-tcp-debug` so the tcp and tls cases run too.
        # `source_invariants` is ungated (it scans `src/`); it runs here so
        # the PR gate covers it, not only the manual integration-test
        # workflow.
        run: |
          cargo test -p rsbinder --features rpc --lib rpc::
          cargo test -p rsbinder --features rpc --test rpc_e2e --test rpc_scenarios --test rpc_server --test rpc_fd --test rpc_shared_memory --test rpc_cross_stack --test rpc_transport_conformance --test source_invariants
          cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_tls --test rpc_transport_conformance
      - name: RPC accessor (hermetic, requires android_16 — gap-fill)
        # `rpc_accessor.rs` is `#![cfg(all(feature = "rpc", feature =
        # "android_16"))]`; without `android_16` the file compiles to
        # zero tests, which is why it wasn't covered by the default
        # `--features rpc` step. Single-conn throughout (no slot-cap
        # interaction), so default-features cover it fully.
        run: |
          cargo test -p rsbinder --features rpc,android_16 --test rpc_accessor
      - name: Generated-stub + entry-API e2e (tests crate)
        # The `tests` crate has no `default` feature and every file below is
        # `#![cfg(feature = "rpc")]`, so a target left off this line compiles
        # to zero tests everywhere else in the workflow — `cargo test
        # --workspace --no-run` included. Every hermetic `rpc` target of the
        # crate is therefore named here: `entry_rpc` (the
        # `serve`/`connect`/`Client` gate), `codegen_shapes`, the async stub
        # adapter, `get_calling_uid` over RPC, the `@EnforcePermission` deny,
        # and `gateway_rpc` (the re-publish/`Rewrap` gate). `macro_cross`
        # needs `macros` too and is on the next step; the two mesh targets and
        # `gateway_kernel` are integration-test.yml's (see the ledger on
        # `linux-build`'s "Check test builds").
        run: |
          cargo test -p tests --features rpc --test rpc_generated_stub --test entry_rpc --test gateway_rpc --test codegen_shapes \
            --test rpc_async --test rpc_calling_identity --test rpc_enforce_permission_deny
          cargo test -p tests --features rpc-tcp-debug --test rpc_generated_stub
      - name: Interface macro (plan 2-19 — golden equivalence, UI, e2e, interop)
        # `rsbinder-macros` holds the contract this feature rests on: a trait
        # through the macro and the equivalent `.aidl` must generate the same
        # code. The other two prove it at runtime — a macro-declared interface
        # over RPC, and macro/`.aidl` calling each other in both directions.
        run: |
          cargo test -p rsbinder-macros
          cargo test -p rsbinder --features macros,rpc --test macro_interface
          cargo test -p tests --features rpc,macros --test macro_cross

      - name: V5 parallel-safety soak (default test-threads, 5x)
        run: |
          for i in 1 2 3 4 5; do
            echo "soak iteration $i"
            cargo test -p rsbinder --features rpc --test rpc_server --test rpc_e2e || exit 1
          done

  macos-build:
    # macOS is a first-class target per plan 2-9 (Phase A+B). The
    # kernel-binder path is Linux/Android-only, so the matrix here is
    # workspace check + RPC stack (mem/unix/tls backends) — no
    # binderfs, no servicemanager. Closes the "macOS first-class
    # advertised, 0 CI jobs" gap from the comprehensive review.
    name: macOS Build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - name: Workspace check (all features)
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: ""
      - name: rsbinder-tools build (rsb_device + rsb_hub compile-only)
        run: cargo build -p rsbinder-tools --release
      - name: rsb_device unit (mounts parser)
        run: cargo test -p rsbinder-tools --bin rsb_device
      - name: RPC hermetic (multi-conn now default per AC-12.6)
        # The macOS half of the `shutdown` conformance gate: this is the
        # platform that drops its receive queue on a local shutdown and
        # accepts the peer's first send afterwards, so the suite has to
        # run on both runners to pin the split. See the matching step in
        # `rpc-suite` for the feature-gate reasoning.
        run: |
          cargo test -p rsbinder --features rpc --lib rpc::
          cargo test -p rsbinder --features rpc --test rpc_e2e --test rpc_scenarios --test rpc_server --test rpc_fd --test rpc_shared_memory --test rpc_cross_stack --test rpc_transport_conformance --test source_invariants
          cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_tls --test rpc_transport_conformance
          cargo test -p rsbinder --features rpc,android_16 --test rpc_accessor
      - name: AIDL compiler tests (hermetic — plan 3 AC-3.4)
        # See the matching step in `linux-build` — plan 3 AC-3.4
        # requires the sweep + allowlist gate to run on both Linux and
        # macOS so codegen regressions can't sneak through the macOS
        # path either.
        run: cargo test -p rsbinder-aidl

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [x86_64-linux-android, aarch64-linux-android]
    steps:
    - uses: actions/checkout@v7
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26c
        add-to-path: false
        local-cache: true
    - name: Install Rust stable for cargo-ndk
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }} # Keep targets for stable as well, in case cargo-ndk needs it
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version "^3.0"
    - name: Install Rust ${{ env.rust_min }} for build
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust_min }}
        targets: ${{ matrix.target }}
        override: true # Ensure this toolchain overrides the previous one for subsequent steps
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}-${{ env.rust_min }} # Add rust_min to cache key as it's specific now
    - name: Build for Android (${{ matrix.target }})
      run: cargo ndk -t ${{ matrix.target }} build --release
    - name: Check test builds for Android (${{ matrix.target }})
      run: |
        cargo ndk -t ${{ matrix.target }} test --no-run

