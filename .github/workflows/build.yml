name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC

env:
  CARGO_TERM_COLOR: always
  rust_min: '1.86'

jobs:
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Run audit
        uses: actions-rust-lang/audit@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver_checks:
    # Pre-merge guard against accidental public-API breakage on the path
    # to 1.0. Runs only on PRs (where the base commit is well-defined);
    # `push`/`schedule` skip this job. Non-blocking: a true breaking
    # change can still be merged when intentional, but it must be
    # acknowledged in the PR — the failed check makes the diff visible
    # in the review surface. See workstream A-1 of the comprehensive
    # review.
    name: SemVer Checks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Check semver (rsbinder + rsbinder-aidl)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          # The two published library crates whose public API stability
          # matters to downstream consumers. `rsbinder-tools` is binaries
          # only, no library surface.
          package: rsbinder,rsbinder-aidl
          # `default` profile already exercises the common surface; the
          # RPC stack has its own dedicated stability discussion (see
          # RpcServer::set_max_threads rustdoc) and is checked under
          # `rpc` features by the next step.
          feature-group: default-features
      - name: Check semver (rsbinder w/ rpc features)
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: rsbinder
          feature-group: only-explicit-features
          # `async` is added so the published-baseline build can resolve
          # `crate::BoxFuture` re-exported from `lib.rs` under
          # `#[cfg(feature = "async")]`. The latest published rsbinder
          # (currently 0.8.0) emits async-trait references unconditionally
          # in its generated code — fixed on HEAD via `build.rs` reading
          # `CARGO_FEATURE_ASYNC`, but the baseline can't be retroactively
          # patched. Without `async` in the feature set, semver-checks
          # fails to `cargo doc` the baseline crate.
          features: rpc,rpc-tcp-debug,rpc-tls,rpc-vsock,async

  public_api:
    # `semver_checks` above answers "did anything break?". This answers
    # the question that has no owner otherwise: "what did we add?" — a
    # surface that grows one `pub` at a time, each defensible on its own,
    # is how a crate ends up with two paths to everything. The golden
    # makes every addition a line in a reviewable diff.
    #
    # Two feature sets, because most of the crate is not in the default
    # one: everything RPC — including `to_bytes`/`from_bytes`, which need
    # the session-less parcel mode — would otherwise change unobserved.
    #
    # To update after an intentional change, run the same commands and
    # commit the result:
    #
    #   cargo +nightly-2026-05-25 public-api -p rsbinder --simplified > api/rsbinder.txt
    #   cargo +nightly-2026-05-25 public-api -p rsbinder --simplified --features rpc > api/rsbinder-rpc.txt
    #
    # Both the toolchain and the tool version are pinned because the
    # rendering is not stable across either; bumping one means
    # regenerating the golden in the same commit.
    name: Public API golden
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust nightly (pinned — rustdoc JSON needs nightly)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-25
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked --version 0.52.0
      - name: Diff the public surface against the goldens
        run: |
          cargo public-api -p rsbinder --simplified > /tmp/public-api.txt
          diff -u api/rsbinder.txt /tmp/public-api.txt
          cargo public-api -p rsbinder --simplified --features rpc > /tmp/public-api-rpc.txt
          diff -u api/rsbinder-rpc.txt /tmp/public-api-rpc.txt

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check rustdoc
        # docs.rs builds `rsbinder` with `all-features`, so a link that only
        # resolves with `rpc` on still ships — but anyone running `cargo doc`
        # on a default-feature dependency sees it break. Gate both.
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: |
          cargo doc --workspace --no-deps --all-features
          cargo doc --workspace --no-deps

  linux-build:
    name: Linux Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - name: Check workspace
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: "" # remove -Dwarnings
      - name: Build release
        run: cargo build --workspace --release
      - name: Check test builds
        # The only workspace-wide enumeration this workflow has — but it
        # compiles, it does not run, and a target gated on a feature the run
        # does not enable compiles to *zero* tests. So every test target is
        # either named on a `--test` line in this job, `rpc-suite` or
        # `macos-build`, or
        # run whole-package (`-p rsbinder-aidl`, `-p rsbinder-macros`, whose
        # targets are ungated), or excluded here on purpose:
        #   * rsbinder/tests/rpc_vsock.rs — every test in it is `#[ignore]`d
        #     (needs a peer VM or the `vsock_loopback` module), so running it
        #     yields nothing; the `test` job's
        #     `cargo clippy --all-targets --all-features` is what type-checks
        #     it (the `rpc-vsock` matrix step is a plain `cargo build`, which
        #     compiles lib + bins only, never `tests/`).
        #   * rsbinder/tests/loom_cache_pin.rs — `cfg(loom)`, empty without
        #     `RUSTFLAGS="--cfg loom"`; a loom run is a manual exercise.
        #   * tests/tests/mesh_rpc.rs, tests/tests/mesh_kernel.rs — the
        #     multi-process mesh: minutes-expensive, and `mesh_kernel` needs
        #     /dev/binder plus a live rsb_hub, so integration-test.yml owns
        #     both.
        #   * tests/tests/gateway_kernel.rs — every test in it is `#[ignore]`d
        #     and needs /dev/binder plus a live rsb_hub to drive an RPC client
        #     through a gateway to a kernel service, so integration-test.yml
        #     owns it.
        #   * tests/tests/async_wait.rs, tests/tests/entry_kernel_options.rs —
        #     `#[ignore]`d for the same reason: the first waits on a live
        #     service manager, the second needs the process's one kernel
        #     binder mapping. integration-test.yml owns both.
        #   * tests/tests/fmq_binder.rs — `#[ignore]`d: an FMQ descriptor
        #     across the kernel binder between two rsbinder processes, so
        #     /dev/binder plus a live rsb_hub. integration-test.yml owns it.
        #   * tests/tests/reconnect_kernel.rs, tests/tests/reconnect_hub_restart.rs
        #     — `#[ignore]`d: /dev/binder plus a live rsb_hub, and the second
        #     restarts the context manager itself. integration-test.yml owns both.
        #   * rsbinder-fmq/tests/libfmq_host.rs — `#[ignore]`d: needs the C++
        #     peer built from the AOSP checkout
        #     (`rsbinder-fmq/tests/cpp/build_host_peer.sh`). Run by hand.
        # Adding a test target means adding it to one of those lines, or to
        # this list with the reason it cannot run here.
        run: |
          cargo test --workspace --no-run
      - name: AIDL compiler tests (hermetic — plan 3 AC-3.4)
        # The `rsbinder-aidl` integration tests — including
        # `aidl_fixture_sweep` which walks all AOSP `.aidl` fixtures
        # and gates on `syn::parse_file` of every emitted file plus the
        # expected-fail allowlist (plan 3 §3 AC-3.1/3.3) — are hermetic
        # (no /dev/binder, no kernel binder, no servicemanager) and
        # must run on every PR so codegen regressions are caught
        # before merge.
        run: cargo test -p rsbinder-aidl
      - name: Async runtime adapter tests (hermetic — plan 11 AC-11.1)
        # `tests/tests/async_runtime.rs` drives the `TokioRuntime`
        # `block_on` adapter through a purely local binder — no /dev/binder,
        # no servicemanager, no `rpc` feature — so it runs on this runner.
        # The workspace line above only compiles it, and every `-p tests`
        # line in `rpc-suite` enumerates `--test` targets, so without this
        # step the adapter would have no run gate at all.
        run: cargo test -p tests --test async_runtime
      - name: Generic parcelables + builtin FMQ types (hermetic — plan 12 F0)
        # `tests/tests/fmq_parcel.rs` round-trips `MQDescriptor` (with a real
        # queue's fd) and a generic parcelable through a `Parcel`: no
        # /dev/binder, no feature.
        run: cargo test -p tests --test fmq_parcel
      - name: NDK stream header on the host (hermetic — plan 10-7b P4)
        # `tests/tests/c_stream_header.rs` builds `contrib/ndk/rsbinder_stream.h`
        # with the runner's `cc` (AddressSanitizer + UBSan) and `c++` and runs
        # both ends of a stream in one process: no /dev/binder, no feature.
        run: cargo test -p tests --test c_stream_header
      - name: Fast Message Queue tests (hermetic — plan 12 AC-12.1–12.6)
        # `rsbinder-fmq` needs memfd and futex only: no /dev/binder, no
        # servicemanager. Its `tests/libfmq_host.rs` is `#[ignore]`d — it
        # drives a C++ peer built from the AOSP checkout by
        # `rsbinder-fmq/tests/cpp/build_host_peer.sh`, which this runner
        # does not have. `tests/c_header.rs` does run here: it compiles
        # the C header's peer with the runner's own `cc` and `c++` (plan
        # 10-7b P4).
        run: cargo test -p rsbinder-fmq
      - name: rsbinder-tools unit tests (hermetic)
        # The `rsb_hub` configuration parser, policy and enforcer, the NSS
        # and notify helpers, and the three binaries' own tests: none opens
        # the binder device, so the whole package runs here.
        run: cargo test -p rsbinder-tools

  rpc-suite:
    name: RPC Transport Suite
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      # The RPC stack is hermetic — mem/unix backends only, no
      # /dev/binder, no binderfs, no servicemanager (master §6). It
      # runs on a plain runner, unlike the kernel-binder matrix in
      # integration-test.yml. This job is the missing CI enforcement
      # of the plan's V1/V4/V5 gates for the RPC stack (T3).
      - name: AC-1.1 build matrix (rpc OFF / rpc / tcp-debug / tls / vsock)
        run: |
          cargo build -p rsbinder
          cargo build -p rsbinder --features rpc
          cargo build -p rsbinder --features rpc-tcp-debug
          cargo build -p rsbinder --features rpc-tls
          cargo build -p rsbinder --features rpc-vsock
      - name: rsbinder unit + doc + RPC e2e (hermetic — multi-conn now default per AC-12.6)
        # `rpc_transport_conformance` is what makes the
        # `RpcTransport::shutdown` contract measured rather than merely
        # written, and the behaviour it pins differs by platform — so it
        # runs here *and* in `macos-build`. The file is
        # `#![cfg(feature = "rpc")]` with `#[cfg(feature =
        # "rpc-tcp-debug")]` / `#[cfg(feature = "rpc-tls")]` submodules:
        # the plain `rpc` run covers the unix/unix-fd/mem cases, and the
        # TLS run adds `rpc-tcp-debug` so the tcp and tls cases run too.
        # `source_invariants` is ungated (it scans `src/`); it runs here so
        # the PR gate covers it, not only the manual integration-test
        # workflow.
        #
        # The *lib unit* tests run whole, less the ones that open the binder
        # device: `scripts/ci_rsbinder_lib_tests.sh` holds that list and
        # why one `--features rpc` run covers every other lib test.
        run: |
          # libtest exits 0 when a filter matches nothing, so a renamed
          # target would empty a filter line silently. Every filtered line
          # goes through this: it fails the step unless the run reported
          # at least one passing test.
          t() { "$@" 2>&1 | tee /tmp/rpc_filter.out; grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/rpc_filter.out; }
          bash scripts/ci_rsbinder_lib_tests.sh
          t cargo test -p rsbinder --features rpc --doc
          cargo test -p rsbinder --features rpc --test rpc_e2e --test rpc_scenarios --test rpc_server --test rpc_fd --test rpc_shared_memory --test rpc_cross_stack --test rpc_transport_conformance --test source_invariants --test blob_rpc --test pipe_rpc --test parcel_alloc
          cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_tls --test rpc_transport_conformance
          t cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_server -- --exact tls_android13plus_nested_callback_e2e
          t cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_server -- --exact preconnected_inet_fd_handshakes_over_tcp_debug
      - name: TCP links cut inside a network namespace (plan 2-24 §5.2)
        # `rpc_link_break` reruns itself under `unshare -rn` and drops a
        # port's packets with `nft`, so that keepalive and TCP_USER_TIMEOUT
        # really fire. Ubuntu 24.04 keeps unprivileged user namespaces behind
        # an AppArmor switch; REQUIRED turns a skip into a failure here.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq nftables; }
          RSB_LINK_BREAK_REQUIRED=1 cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_link_break -- --nocapture
      - name: RPC accessor (hermetic, requires android_16 — gap-fill)
        # `rpc_accessor.rs` is `#![cfg(all(feature = "rpc", feature =
        # "android_16"))]`; without `android_16` the file compiles to
        # zero tests, which is why it wasn't covered by the default
        # `--features rpc` step. Single-conn throughout (no slot-cap
        # interaction), so default-features cover it fully.
        run: |
          cargo test -p rsbinder --features rpc,android_16 --test rpc_accessor
      - name: Generated-stub + entry-API e2e (tests crate)
        # The `tests` crate has no `default` feature and every file below is
        # `#![cfg(feature = "rpc")]`, so a target left off this line compiles
        # to zero tests everywhere else in the workflow — `cargo test
        # --workspace --no-run` included. Every hermetic `rpc` target of the
        # crate is therefore named here: `entry_rpc` (the
        # `serve`/`connect`/`Client` gate), `codegen_shapes`, the async stub
        # adapter, `get_calling_uid` over RPC, the `@EnforcePermission` deny,
        # `gateway_rpc` (the re-publish/`Rewrap` gate), `transport_caps`, and
        # the RPC halves of cancellation and streaming. `macro_cross`
        # and `data_serde` need `macros` too and are on the next step; the
        # two mesh targets and `gateway_kernel` are integration-test.yml's
        # (see the ledger on `linux-build`'s "Check test builds").
        run: |
          cargo test -p tests --features rpc --test rpc_generated_stub --test entry_rpc --test gateway_rpc --test codegen_shapes \
            --test rpc_async --test rpc_calling_identity --test rpc_enforce_permission_deny \
            --test work_source_rpc --test observer_rpc --test transaction_names \
            --test transport_caps --test cancel_rpc --test stream_rpc --test reconnect_rpc
          cargo test -p tests --features rpc-tcp-debug --test rpc_generated_stub
          # `aidl_spans` installs a global `tracing` subscriber, so it needs
          # the `tracing` feature on top of `rpc`.
          cargo test -p tests --features rpc,tracing --test aidl_spans
      - name: Interface macro (plan 2-19 — golden equivalence, UI, e2e, interop)
        # `rsbinder-macros` holds the contract this feature rests on: a trait
        # through the macro and the equivalent `.aidl` must generate the same
        # code. The other two prove it at runtime — a macro-declared interface
        # over RPC, and macro/`.aidl` calling each other in both directions.
        run: |
          cargo test -p rsbinder-macros
          cargo test -p rsbinder --features macros,rpc --test macro_interface
          cargo test -p tests --features rpc,macros --test macro_cross
          # `data_serde` needs a real parcelable to show the property
          # `to_bytes` is sold on — a record read back by code built
          # against a different version of its definition — so it lands
          # here rather than beside the primitives.
          cargo test -p tests --features rpc,macros --test data_serde

      - name: Data-serialization example (`.aidl` path — runs, not just builds)
        # `serde_demo` is the one example that needs no binder device, no
        # service manager and no peer, so CI can actually *run* it instead of
        # only compiling it. Its asserts are the book's *Storing Values*
        # claims — the round trip, both directions of version skew across an
        # appended `.aidl` field, the strict read, and the write-time fd
        # refusal — so a regression in any of them fails here rather than in a
        # reader's terminal.
        #
        # `--features rpc` only, deliberately: `data_serde` above covers the
        # `macros` declaration and this covers the `.aidl` one, which is the
        # path the chapter is written around and the one every non-Rust
        # consumer would use.
        run: cargo run -p example-hello --features rpc --bin serde_demo

      - name: V5 parallel-safety soak (default test-threads, 5x)
        run: |
          for i in 1 2 3 4 5; do
            echo "soak iteration $i"
            cargo test -p rsbinder --features rpc --test rpc_server --test rpc_e2e || exit 1
          done

  big-endian:
    # The parcel wire is defined little-endian on every host, and this is
    # the only job that can tell. Every other runner is little-endian, so
    # the wire codec and a host-native one emit identical bytes there —
    # the entire suite stays green either way.
    #
    # s390x through `cross`, which supplies the cross linker and a
    # qemu-user runner in its Docker image; the runner has Docker, so
    # nothing else is needed. The kernel-binder path is out of scope
    # (there is no binderfs in the container, and no big-endian one
    # anywhere) — this covers the wire, which is what portability means.
    name: Big-endian wire (s390x)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          # `cross` mounts the host toolchain into the container, so the
          # target has to be installed out here rather than in the image.
          targets: s390x-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Control — the same filter on x86_64
        # The only x86_64 run of the *same* `--no-default-features` filter
        # (`rpc-suite` runs `--features rpc --lib parcel::`, a different
        # feature set; `test`/`linux-build` build the parcel unit tests but
        # do not run them; the kernel-binder matrix lives in
        # integration-test.yml). Without this, a failure below cannot be
        # read as "big-endian" rather than "broken everywhere".
        #
        # Every run in this job is guarded the way `rpc-suite` guards its
        # `thread_state::tests::rpc_` line: libtest exits 0 when a filter
        # matches nothing, so a renamed or newly `cfg`-gated `mod tests`
        # would empty these lines silently and the job would stay green
        # with no big-endian signal at all.
        #
        # The `blob` line is x86_64-only: it is the one test that pins
        # `allow_fds() == false` on a data-only parcel, which is what
        # makes `write_blob` store its payload inline there, and it
        # exercises a memfd on the shared-memory side that qemu-user
        # does not implement.
        run: |
          cargo test -p rsbinder --no-default-features --lib parcel -- --skip shared_memory --skip fmq:: 2>&1 | tee /tmp/control_parcel.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/control_parcel.out
          cargo test -p rsbinder --no-default-features --lib blob:: 2>&1 | tee /tmp/control_blob.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/control_blob.out
      - name: Install cross
        run: cargo install cross --locked
      - name: Confirm the binary really is big-endian
        # A silent fallback to a host-native build would pass every test
        # below and prove nothing, and it looks exactly like success.
        # `file` must say MSB / IBM S/390 before any result counts.
        run: |
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --no-default-features --lib parcel --no-run
          file target/s390x-unknown-linux-gnu/debug/deps/rsbinder-* | tee /tmp/file.out
          grep -q 'MSB.*IBM S/390' /tmp/file.out
      - name: AC-7.3 cross-endian wire goldens + parcel codec
        # The goldens assert literal little-endian bytes, so a big-endian
        # build that reproduces them is cross-endian compatible by
        # construction — no networking, no peer.
        #
        # The bare `parcel` filter is a substring match, so it also pulls
        # in tests named after parcels from modules that create a memfd,
        # which qemu-user does not implement. `--skip` drops each such
        # module (`shared_memory`, `fmq::`); they are endianness-blind
        # and covered by every other job. The control step above runs the
        # same filter, skips included.
        #
        # The fd-over-RPC body goldens are `#[cfg(feature = "rpc")]`, so
        # the `--no-default-features` run cannot see them even though
        # they too assert literal LE bytes. The feature set matches the
        # AC-7.2 step below so the build is shared rather than a third
        # cross compile. (`parcel::data_serde` needs no feature and so
        # runs in the first line, where its stored bytes are asserted
        # against the same goldens on a big-endian host.)
        run: |
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --no-default-features --lib parcel -- --skip shared_memory --skip fmq:: 2>&1 | tee /tmp/be_parcel.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/be_parcel.out
          # Kernel objects are in host byte order: `handle` must land in the union's first bytes.
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --no-default-features --lib binder_object:: 2>&1 | tee /tmp/be_object.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/be_object.out
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --features rpc,rpc-tcp-debug --lib file_descriptor:: 2>&1 | tee /tmp/be_fd.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/be_fd.out
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --features rpc,rpc-tcp-debug --lib parcel:: -- --skip shared_memory 2>&1 | tee /tmp/be_parcel_rpc.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/be_parcel_rpc.out
      - name: AC-7.2 RPC stack on a big-endian host
        run: |
          cross test -p rsbinder --target s390x-unknown-linux-gnu \
            --features rpc,rpc-tcp-debug --lib rpc:: 2>&1 | tee /tmp/be_rpc.out
          grep -qE 'test result: ok\. [1-9][0-9]* passed' /tmp/be_rpc.out
      # `source_invariants` is not run here: it is a static scan of `src/`
      # with no endianness-dependent code, and `rpc-suite` and `macos-build`
      # already run it on the same tree — a third, cross-compiled run adds
      # no big-endian signal.

  macos-build:
    # macOS is a first-class target per plan 2-9 (Phase A+B). The
    # kernel-binder path is Linux/Android-only, so the matrix here is
    # workspace check + RPC stack (mem/unix/tls backends) — no
    # binderfs, no servicemanager. Closes the "macOS first-class
    # advertised, 0 CI jobs" gap from the comprehensive review.
    name: macOS Build
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust ${{ env.rust_min }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.rust_min }}
      - uses: Swatinem/rust-cache@v2
      - name: Workspace check (all features)
        run: cargo check --workspace --all-features
        env:
          RUSTFLAGS: ""
      - name: rsbinder-tools build (rsb_device + rsb_hub compile-only)
        run: cargo build -p rsbinder-tools --release
      - name: rsb_device unit (mounts parser)
        run: cargo test -p rsbinder-tools --bin rsb_device
      - name: rsbinder unit + doc + RPC hermetic (multi-conn now default per AC-12.6)
        # The macOS half of the `shutdown` conformance gate: this is the
        # platform that drops its receive queue on a local shutdown and
        # accepts the peer's first send afterwards, so the suite has to
        # run on both runners to pin the split. See the matching step in
        # `rpc-suite` for the feature-gate reasoning.
        run: |
          # Filter lines must report a passing test: see `t()` in `rpc-suite`.
          t() { "$@" 2>&1 | tee "$RUNNER_TEMP/rpc_filter.out"; grep -qE 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/rpc_filter.out"; }
          bash scripts/ci_rsbinder_lib_tests.sh
          t cargo test -p rsbinder --features rpc --doc
          cargo test -p rsbinder --features rpc --test rpc_e2e --test rpc_scenarios --test rpc_server --test rpc_fd --test rpc_shared_memory --test rpc_cross_stack --test rpc_transport_conformance --test source_invariants --test blob_rpc --test pipe_rpc --test parcel_alloc
          cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_tls --test rpc_transport_conformance
          t cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_server -- --exact tls_android13plus_nested_callback_e2e
          t cargo test -p rsbinder --features rpc-tls,rpc-tcp-debug --test rpc_server -- --exact preconnected_inet_fd_handshakes_over_tcp_debug
          cargo test -p rsbinder --features rpc,android_16 --test rpc_accessor
      - name: Reconnecting over RPC (tests crate — plan 10-10b)
        # Before each call on the default `unix://…#name` session the helper
        # asks `RpcTransport::peer_closed`, which polls `POLLHUP` here and
        # `POLLRDHUP` on Linux; this step is the run that covers the XNU half.
        run: cargo test -p tests --features rpc --test reconnect_rpc
      - name: AIDL compiler tests (hermetic — plan 3 AC-3.4)
        # See the matching step in `linux-build` — plan 3 AC-3.4
        # requires the sweep + allowlist gate to run on both Linux and
        # macOS so codegen regressions can't sneak through the macOS
        # path either.
        run: cargo test -p rsbinder-aidl
      - name: Fast Message Queue on a target without one (plan 12 AC-12.8)
        # The crate compiles everywhere; off Linux/Android every constructor
        # returns `Unsupported`, and that is the one test that runs here.
        run: cargo test -p rsbinder-fmq

  android-build:
    name: Android Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        target: [x86_64-linux-android, aarch64-linux-android]
    steps:
    - uses: actions/checkout@v7
    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r26c
        add-to-path: false
        local-cache: true
    - name: Install Rust stable for cargo-ndk
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: ${{ matrix.target }} # Keep targets for stable as well, in case cargo-ndk needs it
    - name: Install cargo-ndk
      run: cargo install cargo-ndk --version "^3.0"
    - name: Install Rust ${{ env.rust_min }} for build
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ env.rust_min }}
        targets: ${{ matrix.target }}
        override: true # Ensure this toolchain overrides the previous one for subsequent steps
    - uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}-${{ env.rust_min }} # Add rust_min to cache key as it's specific now
    # -p 29: the oldest supported Android; cargo-ndk's default (21) lacks e.g. process_vm_readv.
    - name: Build for Android (${{ matrix.target }})
      run: cargo ndk -t ${{ matrix.target }} -p 29 build --release
    - name: Check test builds for Android (${{ matrix.target }})
      run: |
        cargo ndk -t ${{ matrix.target }} -p 29 test --no-run

