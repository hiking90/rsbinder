[package]
name = "rsbinder-topic"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "One publisher and many subscribers over kernel binder: a binder call sets a subscription up, and the records then travel through shared memory the subscribers map read-only. Experimental."
homepage = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
keywords = ["android", "binder", "shared-memory", "ipc", "linux"]
# Held back until the crate has its public API (plan 15).
publish = false

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[features]
default = ["tokio"]
# The async receive path. Without it the crate is its sync API alone.
tokio = ["rsbinder/tokio", "dep:tokio"]
# The entry point the `fuzz/` crate calls, as `rsbinder`'s feature of the
# same name: absent from every other build.
fuzzing = []

[dependencies]
# Not `workspace = true`: a member cannot turn off the default features of an
# inherited dependency, and this crate must build without `rsbinder/tokio`.
# The shared-memory primitives come through `rsbinder::fmq::shm`, so there is
# no direct dependency on `rsbinder-fmq`. `async` always: the generated AIDL
# code takes one shape or the other by `rsbinder`'s `async`, which another
# crate in the build can turn on and `build.rs` cannot see. It adds no runtime.
rsbinder = { version = "0.12.0", path = "../rsbinder", default-features = false, features = ["async"] }
# `Errno`, to tell "the kernel has no `F_SEAL_FUTURE_WRITE`" from the other
# failures of a seal. `event` and `net`: the fd wake, a socket pair, an eventfd
# and `poll` (both are features `rsbinder` turns on already).
rustix = { workspace = true, features = ["event", "net"] }
# `Notify`: a `recv_async` joins the wait a dropped one left on the blocking pool.
# `net`: `AsyncFd`, which a `recv_async` of an fd-woken subscription waits on.
tokio = { workspace = true, optional = true, features = ["sync", "net"] }

[build-dependencies]
rsbinder-aidl = { workspace = true }
miette = { workspace = true }

[dev-dependencies]
# `#[derive(rsbinder::Parcelable)]` for the tests' parcelables: the code `.aidl` generates.
# `rpc`: an RPC binder, which a subscriber refuses.
rsbinder = { version = "0.12.0", path = "../rsbinder", default-features = false, features = ["macros", "rpc"] }
# `setrlimit`, for a subscriber that cannot take the reply's fd. `pipe` and
# `param`: an fd of the wrong kind for a wake, and the page a fault is held in.
rustix = { workspace = true, features = ["process", "pipe", "param"] }
# `userfaultfd` and `SIGPIPE`'s default, which rustix does not offer.
libc = { workspace = true }
# A runtime for `recv_async`'s tests; `time` bounds a wait that a mutant would lose.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }

# loom is only used by the unit tests gated on `--cfg loom` (`src/ring/loom_tests.rs`).
# Run with (a target dir of its own: the cfg rebuilds every dependency):
#   CARGO_TARGET_DIR=target/loom RUSTFLAGS="--cfg loom" \
#       cargo test -p rsbinder-topic --lib --release loom
# Without the cfg the module is not compiled.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"
