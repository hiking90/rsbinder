[package]
name = "rsbinder-macros"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
description = "Procedural macros for rsbinder — define Binder interfaces as Rust traits, without .aidl."
homepage = { workspace = true }
repository = { workspace = true }
readme = "README.md"
rust-version = { workspace = true }
keywords.workspace = true

[package.metadata.docs.rs]
all-features = true

[lib]
proc-macro = true

[features]
default = []
# Emit the `IFooAsync` / `IFooAsyncService` halves, matching
# `rsbinder-aidl`'s `set_async_support(true)`. Wired from `rsbinder`'s own
# `async` feature through its `macros` feature.
async = []

[dependencies]
rsbinder-aidl = { workspace = true }
syn = { version = "2", features = ["full", "parsing", "printing"] }
proc-macro2 = "1"
quote = "1"

[dev-dependencies]
# The UI tests compile real macro invocations, so they need the runtime the
# generated code names. This is a dev-dependency cycle (rsbinder depends on
# this crate for the `macros` feature); cargo allows it, and it keeps the
# rejection messages tested where they are written.
rsbinder = { workspace = true, features = ["macros"] }
trybuild = "1"
