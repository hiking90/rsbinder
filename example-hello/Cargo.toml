[package]
name = "example-hello"
version = { workspace = true }
publish = false
edition = { workspace = true }
license = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Build the RPC (binder-over-socket) example bins. Off by default so
# the normal `cargo build --workspace` and the kernel-binder examples
# are unchanged; opt in explicitly:
#   cargo run -p example-hello --features rpc --bin rpc_hello_service
#   cargo run -p example-hello --features rpc --bin rpc_hello_client
rpc = ["rsbinder/rpc"]
# Subplan 2-13 — opt in to the android-16 accessor bridge symbols
# (`hub::android_16::resolve_accessor`); only used by the STAGE3
# interop client.
android_16 = ["rsbinder/android_16"]
# `rpc_incoming_interop_client` asserts on connection-slot and
# incoming-thread counters, which live behind `rsbinder/test-util`. It is
# a STAGE3 harness rather than an example, so it carries the feature
# rather than the counters being on for everyone.
test-util = ["rsbinder/test-util"]

[[bin]]
name = "rpc_hello_service"
required-features = ["rpc"]

[[bin]]
name = "rpc_hello_client"
required-features = ["rpc"]

# The cross-transport example: identical service/registration/call code,
# kernel vs RPC chosen by the URI argument. Gated on the `rpc` feature so
# the RPC URIs are available.
#   cargo run -p example-hello --features rpc --bin unified_service rpc
#   cargo run -p example-hello --features rpc --bin unified_client rpc
[[bin]]
name = "unified_service"
required-features = ["rpc"]

[[bin]]
name = "unified_client"
required-features = ["rpc"]

# The gateway: front an `IHello` reached over one transport on another,
# with `BnHello::new_binder(upstream_proxy)`. See
# `book/src/cross-transport-services.md`.
#   cargo run -p example-hello --features rpc --bin gateway_service \
#       binder://my.hello unix:///tmp/rsb_gw.sock
[[bin]]
name = "gateway_service"
required-features = ["rpc"]

# Plan 2-16 handler-side authorization example: the service impl authorizes
# each call via `rsbinder::calling_caller()` and denies with EX_SECURITY.
# Uses `rsbinder::Caller` / `rpc::PeerIdentity`, so gated on the `rpc` feature.
#   cargo run -p example-hello --features rpc --bin authz_service
#   cargo run -p example-hello --features rpc --bin authz_client
[[bin]]
name = "authz_service"
required-features = ["rpc"]

[[bin]]
name = "authz_client"
required-features = ["rpc"]

# Subplan 2-13 D.8 STAGE3 — rsbinder side of the IAccessor bridge
# real-libbinder interop. Cross-compile with
#   cargo ndk -t arm64-v8a -p 36 build -p example-hello \
#       --features rpc,android_16 --bin rpc_accessor_interop_client
# and run on the android-16 emulator alongside the C++ launcher
# (`cpp/rpc_accessor_interop_launcher.cpp`). See cpp/run_rpc_accessor_interop.sh.
[[bin]]
name = "rpc_accessor_interop_client"
required-features = ["rpc", "android_16"]

# Subplan 2-14 D.9 STAGE3 — rsbinder server side of the IAccessor
# *register*-side real-libbinder interop (the role-inverse of 2-13 D.8).
# rsbinder vends an IAccessor via `LocalAccessor` + `RpcServer`; a real
# libbinder C client calls `addConnection()` over kernel binder, then
# drives an RPC root over the preconnected fd. Cross-compile with
#   cargo ndk -t arm64-v8a -p 36 build -p example-hello \
#       --features rpc,android_16 --bin rpc_accessor_register_interop_server
# and run on the android-16 emulator alongside the C++ launcher
# (`cpp/rpc_accessor_register_interop_launcher.cpp`). See
# cpp/run_rpc_accessor_register_interop.sh.
[[bin]]
name = "rpc_accessor_register_interop_server"
required-features = ["rpc", "android_16"]

# Subplan 2-12 Phase D + C — rsbinder side of the multi-
# connection-per-session real-libbinder interop gate. Pairs with
# cpp/rpc_multiconn_interop_launcher (a real libbinder client built
# with `ARpcSession_setMaxOutgoingConnections(2) + setMaxIncoming
# Threads(1)`). Cross-compile with
#   cargo ndk -t arm64-v8a -p 36 build -p example-hello \
#       --features rpc --bin rpc_multiconn_interop_server
# and run on the android-16 emulator alongside
# cpp/run_rpc_multiconn_interop.sh. AC-12.6 (a) twoway + (b) oneway both PASS post-
# Phase C (2026-05-28); the prior EXPERIMENTAL gate was removed.
[[bin]]
name = "rpc_multiconn_interop_server"
required-features = ["rpc"]

# Plan 2-20 STAGE3 gate (e) — rsbinder client with one incoming (callback)
# connection against a real-libbinder RpcServer that calls back from a
# plain thread. Run via cpp/run_rpc_incoming_interop.sh.
[[bin]]
name = "rpc_incoming_interop_client"
required-features = ["rpc", "test-util"]

# Plan 2-11 AC-11.3 STAGE3 — rsbinder side of the FD-over-RPC
# real-libbinder gate. Pairs with cpp/rpc_fd_interop_launcher (a real
# libbinder `ARpcSession` client with the `Unix` fd transport mode);
# cpp/run_rpc_fd_interop.sh builds, pushes and runs both.
[[bin]]
name = "rpc_fd_interop_server"
required-features = ["rpc"]

# Shared-memory example (plans 4-7a/4-7b/Phase D). Kernel binder needs no
# feature; pass `rpc` on the command line for the Unix-socket variant
# (gated inside the binaries on the `rpc` feature):
#   cargo run -p example-hello --bin shm_service kernel
#   cargo run -p example-hello --features rpc --bin shm_service rpc
[[bin]]
name = "shm_service"

[[bin]]
name = "shm_client"

# STAGE3 gate for the Android 15 service-manager split: drives the whole
# `hub` surface against a real AOSP `servicemanager` and checks that every
# method `android-15.0.0_r6` renumbered still lands where it should. Needs
# no feature — `android_10_plus` below already carries both Android 15
# protocols. Run it through `cpp/run_a15_qpr_stage3.sh`, which exercises
# both numberings.
[[bin]]
name = "a15_qpr_interop"

[dependencies]
rsbinder = { workspace = true, features = ["android_10_plus"] }
env_logger = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
rustix = { workspace = true, features = ["process"] }
libc = { workspace = true }

[build-dependencies]
rsbinder-aidl = { workspace = true, features = ["async"] }
