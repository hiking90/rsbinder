[package]
name = "tests"
version = { workspace = true }
edition = { workspace = true }
publish = false
license = { workspace = true }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Subplan 2-6.B: off by default so the kernel-binder Android CI build
# of this crate (`cargo test -p tests`) pulls in zero RPC code. The
# generated-stub RPC e2e (`tests/rpc_generated_stub.rs`) runs only
# under `--features rpc` (or `rpc-tcp-debug`).
[features]
rpc = ["rsbinder/rpc"]
# Plan 2-19: the `#[rsbinder::interface]` half of `tests/macro_cross.rs`.
macros = ["rsbinder/macros"]
rpc-tcp-debug = ["rsbinder/rpc-tcp-debug", "rpc"]
# Plan 10-9: AIDL spans (`tests/aidl_spans.rs`). `tracing` itself is for the
# test's own subscriber.
tracing = ["rsbinder/tracing", "dep:tracing"]

[dependencies]
rsbinder = { workspace = true, features = ["android_10_plus"] }
# Declared here rather than inherited: `rsbinder`'s `tokio` feature no longer
# pulls `tokio/full`, so feature unification stops supplying these. `time` is
# for `tests/async_runtime.rs`, where a timer is what tells a driven runtime
# apart from an entered one; `macros` is for `tokio::join!` in
# `tests/rpc_async.rs` (no `#[tokio::test]` anywhere — every async test builds
# its runtime by hand).
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
env_logger = { workspace = true }
# `mm`: `src/fmq_peer.rs` maps a queue's fd to damage its counters. `net`: the
# relay in `tests/stream_rpc.rs` carries `SCM_RIGHTS` across, as a ring's memfd needs.
rustix = { workspace = true, features = ["pipe", "param", "mm", "net"] }
async-trait = { workspace = true }
log.workspace = true
tracing = { workspace = true, optional = true }

# Mesh integration node: one binary, configured by argv into a kernel
# and/or RPC role. Driven by `tests/mesh_rpc.rs` (+ `mesh_kernel.rs`).
# Requires `rpc` because every node fronts at least one RPC endpoint.
[[bin]]
name = "mesh_node"
path = "src/bin/mesh_node.rs"
required-features = ["rpc"]

# Declared so a missing feature is an error rather than a file that `#![cfg]`
# compiles away to zero tests and a green run.
[[test]]
name = "macro_cross"
path = "tests/macro_cross.rs"
required-features = ["rpc", "macros"]

[[test]]
name = "data_serde"
path = "tests/data_serde.rs"
required-features = ["macros"]

[[test]]
name = "work_source_rpc"
path = "tests/work_source_rpc.rs"
required-features = ["rpc"]

[[test]]
name = "observer_rpc"
path = "tests/observer_rpc.rs"
required-features = ["rpc"]

[[test]]
name = "stream_rpc"
path = "tests/stream_rpc.rs"
required-features = ["rpc"]

[[test]]
name = "reconnect_rpc"
path = "tests/reconnect_rpc.rs"
required-features = ["rpc"]

# Plan 10-10b kernel tests: a service the tests kill and restart, so the
# shared `test_service` is never touched.
[[bin]]
name = "reconnect_service"
path = "src/bin/reconnect_service.rs"
required-features = ["rpc"]

[[test]]
name = "reconnect_kernel"
path = "tests/reconnect_kernel.rs"
required-features = ["rpc"]

[[test]]
name = "reconnect_hub_restart"
path = "tests/reconnect_hub_restart.rs"
required-features = ["rpc"]

# A death link must survive the previous proxy's late clear (plan 4-3 §10-4).
[[test]]
name = "death_reorder_kernel"
path = "tests/death_reorder_kernel.rs"
required-features = ["rpc"]

# Plan 4-3 Phase D: freeze notifications, observing a `reconnect_service`.
[[test]]
name = "freeze_kernel"
path = "tests/freeze_kernel.rs"
required-features = ["rpc"]

[[test]]
name = "aidl_spans"
path = "tests/aidl_spans.rs"
required-features = ["rpc", "tracing"]

[build-dependencies]
rsbinder-aidl = { workspace = true, features = ["async"] }
