[package]
name = "rsbinder-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "This provides a few CLI binder tools for Linux."
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rsbinder.workspace = true
log.workspace = true
env_logger.workspace = true
anstyle.workspace = true
clap.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
thiserror.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
# `rsb_device` mounts binderfs with mount(2); rustix has `mount` only for Linux.
rustix = { workspace = true, features = ["mount"] }

[features]
# Teach the policy enforcer about RPC callers (`Caller::Rpc`). Off by
# default: `rsb_hub` serves kernel binder only, so nothing in this crate
# needs the RPC stack unless a downstream hub reuses `policy`.
rpc = ["rsbinder/rpc"]
